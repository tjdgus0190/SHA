<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <link rel="stylesheet" href="overlay.css" />
</head>
<body>
  <div class="panel">
    <div class="top-bar" id="dragHandle">
      <div class="top-icons">
        <button id="fullGamutBtn" class="icon-btn" title="전체 색역 보기 전환">
          <svg viewBox="0 0 24 24" width="16" height="16"><path fill="currentColor" d="M12 2a10 10 0 100 20 10 10 0 000-20zm0 2a8 8 0 018 8h-8V4zm-2 0v8H2a8 8 0 018-8zm-8 10h8v8a8 8 0 01-8-8zm10 8v-8h8a8 8 0 01-8 8z"/></svg>
        </button>
        <button id="closeBtn" class="icon-btn" title="팔레트 닫기 (F11 / Esc)">
          <svg viewBox="0 0 24 24" width="14" height="14"><path fill="currentColor" d="M6.4 5 12 10.6 17.6 5 19 6.4 13.4 12 19 17.6 17.6 19 12 13.4 6.4 19 5 17.6 10.6 12 5 6.4z"/></svg>
        </button>
      </div>
    </div>

    <div class="field-wrap">
      <canvas id="fieldCanvas" width="260" height="210"></canvas>
      <div class="field-cursor" id="fieldCursor"></div>
    </div>

    <div class="lightness-slider-row">
      <!-- outer = 0~100 전체 범위를 나타내는 바깥 트랙(항상 꽉 참, 옅은 배경)
           inner(lightnessTrack) = 실제 "이 색이 유지되는" [Lmin,Lmax] 구간만
           차지하는 안쪽 트랙 (실제 색 그라데이션 + 핸들이 여기 들어감) -->
      <div class="lightness-outer" id="lightnessOuter">
        <div class="lightness-track" id="lightnessTrack">
          <div class="lightness-handle" id="lightnessHandle"></div>
        </div>
      </div>
    </div>

    <div class="bottom-row">
      <div class="swatch-stack">
        <div class="swatch back" id="prevSwatch"></div>
        <div class="swatch front" id="currentSwatch"></div>
      </div>
      <div class="history-row" id="historyRow"></div>
    </div>

    <div id="applyFailedBanner" class="apply-failed-banner" hidden>⚠ 색 적용 실패 — 다시 시도해주세요</div>
  </div>
  <script src="overlay.js"></script>
</body>
</html>
