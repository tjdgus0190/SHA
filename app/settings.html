<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <link rel="stylesheet" href="settings.css" />
</head>
<body>
  <div class="wrap">
    <h1 data-i18n="settings.title">SHA Paint 설정</h1>

    <div class="row">
      <label data-i18n="settings.showPopup"></label>
      <div class="key-input">
        <span id="showPopupKeyLabel" class="key-label">-</span>
        <button id="recordShowPopupBtn" class="record-btn" data-i18n="settings.recordKey"></button>
      </div>
    </div>

    <div class="row">
      <label data-i18n="settings.clickFollow"></label>
      <div class="key-input">
        <span id="clickFollowKeyLabel" class="key-label">-</span>
        <button id="recordClickFollowBtn" class="record-btn" data-i18n="settings.recordKey"></button>
      </div>
    </div>

    <div class="row">
      <label data-i18n="settings.trigger"></label>
      <div class="key-input">
        <span id="activationTriggerLabel" class="key-label">-</span>
        <button id="recordActivationTriggerBtn" class="record-btn" data-i18n="settings.recordTrigger"></button>
      </div>
    </div>

    <div id="recordingHint" class="recording-hint" hidden data-i18n="settings.recordingHint"></div>

    <div class="row">
      <label for="languageSelect" data-i18n="settings.language"></label>
      <div class="key-input">
        <select id="languageSelect" class="lang-select">
          <option value="auto" data-i18n="settings.langAuto"></option>
          <option value="ko">한국어</option>
          <option value="en">English</option>
        </select>
      </div>
      <div class="lang-note" data-i18n="settings.langNote"></div>
    </div>

    <div class="actions">
      <button id="saveBtn" class="save-btn" data-i18n="settings.save"></button>
    </div>

    <p class="note" data-i18n="settings.note"></p>
  </div>
  <script src="settings.js"></script>
</body>
</html>
