<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="panel">
    <div class="top-bar">
      <span class="title">SHA Paint</span>
      <div class="top-icons">
        <button id="eyedropperBtn" class="icon-btn" title="">
          <svg viewBox="0 0 24 24" width="16" height="16"><path fill="currentColor" d="M20.71 5.63l-2.34-2.34a1 1 0 00-1.41 0l-3.12 3.12-1.3-1.3-1.42 1.42 1.3 1.3L3 17.25V21h3.75l9.42-9.42 1.3 1.3 1.42-1.42-1.3-1.3 3.12-3.12a1 1 0 000-1.41zM6.34 19H5v-1.34l8.06-8.06 1.34 1.34L6.34 19z"/></svg>
        </button>
        <button id="modeBtn" class="icon-btn" title="">
          <svg viewBox="0 0 24 24" width="16" height="16"><path fill="currentColor" d="M12 2a10 10 0 000 20 10 10 0 000-20zm0 18V4a8 8 0 010 16z"/></svg>
        </button>
      </div>
    </div>

    <div class="field-wrap">
      <canvas id="fieldCanvas" width="240" height="200"></canvas>
      <div class="field-cursor" id="fieldCursor"></div>
    </div>

    <div class="lightness-slider-row">
      <div class="lightness-track" id="lightnessTrack">
        <div class="lightness-handle" id="lightnessHandle"></div>
      </div>
    </div>

    <div class="bottom-row">
      <div class="swatches">
        <div class="swatch-stack">
          <div class="swatch back" id="prevSwatch"></div>
          <div class="swatch front" id="currentSwatch"></div>
        </div>
        <div class="swatch-info">
          <div id="currentHex">#000000</div>
          <div id="currentLumaInfo" class="muted"></div>
        </div>
      </div>
      <div class="bottom-icons">
        <button id="refreshBtn" class="icon-btn" title="">
          <svg viewBox="0 0 24 24" width="15" height="15"><path fill="currentColor" d="M17.65 6.35A7.95 7.95 0 0012 4a8 8 0 108 8h-2a6 6 0 11-1.76-4.24L13 11h7V4l-2.35 2.35z"/></svg>
        </button>
      </div>
    </div>

    <div class="history-row">
      <div id="historyStrip" class="history-strip"></div>
    </div>

    <div id="fieldErrorMsg" class="status error" hidden style="white-space: pre-wrap; word-break: break-all;"></div>

    <div id="statusMsg" class="status" hidden></div>

    <!-- 문구는 index.js의 applyStaticText()가 Photoshop UI 언어에 맞춰 채운다(한국어/영어) -->
    <div class="hint" id="hintText"></div>
  </div>
  <script src="index.js"></script>
</body>
</html>
