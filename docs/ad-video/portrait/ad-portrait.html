<!--
  한 톤(갈색)으로 칠한 얼굴에 같은 명도로 화려한 색을 더하는 15초 영상: "아무리 화려해도 같은 명도라 자연스럽게".
    0.0–2.0   원본(한 톤)
    2.0–8.4   펜이 SHA Paint 팝업에서 색을 찍어 5획으로 칠함(보라 그림자, 마젠타 혈색, 금빛 하이라이트, 코발트 반사광, 핫핑크 머리카락)
    8.5–10.0  원본 ↔ 완성 슬라이드 비교
    10.1–12.2 흑백으로 넘겨도 원본과 같은 명암
    12.2–15   엔드카드
  - 이미지: frames-src/*.png (python lab.py 로 생성). 색 계산은 app/colorMath.js와 같은 식.
  - ?ar=16x9 가로(사이트용), ?lang=en 영문, ?render=1 이면 window.__start() 후 renderAt(t)로 프레임 렌더
-->

<canvas id="c"></canvas>
<script>
(() => {
"use strict";
const CM = window.ColorMath;
const P = new URLSearchParams(location.search);
const LANG = P.get("lang") === "en" ? "en" : "ko";
const WIDE = P.get("ar") === "16x9";
const RENDER = P.get("render") === "1";
const W = WIDE ? 1920 : 1080, H = WIDE ? 1080 : 1920, DURATION = 15;
const cv = document.getElementById("c"); cv.width = W; cv.height = H;
const ctx = cv.getContext("2d");

const BG = "#1c1a1f", RAISED = "#242128", INK = "#f2ede4", DIM = "#a79f97", FAINT = "#75706b", GOLD = "#e8a33d", BAD = "#e2503f", GOOD = "#3fae72";
const css = (c) => `rgb(${c.r},${c.g},${c.b})`;

const T = {
  ko: {
    caps: [
      { t0: 0.1, t1: 1.95, l1: "한 톤으로 칠한 얼굴에", l2: "색을 더해볼게요", sub: "SHA Paint 동명도 팔레트로" },
      { t0: 2.05, t1: 5.15, l1: "그 자리 명도는 그대로,", l2: "색만 화려하게", sub: "보라 그림자 · 마젠타 혈색 · 금빛 하이라이트" },
      { t0: 5.25, t1: 8.4, l1: "같은 명도라서", l2: "화려해도 자연스럽게", sub: "보통 피커였다면 얼룩처럼 떴을 색들입니다" },
      { t0: 8.5, t1: 10.0, l1: "원본과 비교하면", l2: "완전히 다른 그림", sub: "명암은 그대로, 색만 달라졌습니다" },
      { t0: 10.1, t1: 12.15, l1: "흑백으로 보면", l2: "원본과 똑같습니다", sub: "입체감은 그대로 — 평균 명도 차이 0.1 미만" }
    ],
    gray: "흑백", kept: "명암 그대로",
    strokes: ["그림자 + 보라", "혈색 + 마젠타", "하이라이트 + 금빛", "반사광 + 코발트", "머리카락 + 핫핑크"],
    before: "원본", after: "색 추가",
    tag: "<같은 명도>라서, 화려해도 자연스럽게", meta: "$10 · 1회 결제 · Photoshop · Windows",
    cta: "프로필 링크에서 구매", disc: "SHA Paint의 명도(L*) 계산으로 색을 더한 연출 화면"
  },
  en: {
    caps: [
      { t0: 0.1, t1: 1.95, l1: "A face painted in one tone.", l2: "Let's add color", sub: "With SHA Paint's same-value palette" },
      { t0: 2.05, t1: 5.15, l1: "Keep each spot's value,", l2: "go bold with color", sub: "Violet shadows · magenta flush · golden highlights" },
      { t0: 5.25, t1: 8.4, l1: "Same value, so even bold colors", l2: "look natural", sub: "With a normal picker these would look pasted on" },
      { t0: 8.5, t1: 10.0, l1: "Next to the original,", l2: "a whole new painting", sub: "Same light and shadow, only the color changed" },
      { t0: 10.1, t1: 12.15, l1: "In grayscale it's", l2: "identical to the original", sub: "Same depth — mean value difference under 0.1" }
    ],
    gray: "Grayscale", kept: "Values kept",
    strokes: ["Shadow + violet", "Flush + magenta", "Highlight + gold", "Bounce + cobalt", "Hair + hot pink"],
    before: "Original", after: "Color added",
    tag: "<Same value>, bold yet natural", meta: "$10 · One-time · Photoshop · Windows",
    cta: "Shop via link in bio", disc: "Simulated: colors added with SHA Paint's lightness (L*) math"
  }
}[LANG];

// ---------------- 유틸 ----------------
const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
const prog = (t, a, b) => clamp((t - a) / (b - a));
const eio = (x) => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
const eout = (x) => 1 - Math.pow(1 - x, 3);
const back = (x) => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };
const lerp = (a, b, k) => a + (b - a) * k;
const KR = (w, s) => `${w} ${s}px KR, KRFallback, sans-serif`;
function rr(x, y, w, h, r) { ctx.beginPath(); ctx.roundRect(x, y, w, h, r); }
function fitText(str, x, y, maxW, size, weight, color, align = "center") {
  let s = size; ctx.font = KR(weight, s);
  while (ctx.measureText(str).width > maxW && s > 18) { s -= 2; ctx.font = KR(weight, s); }
  ctx.fillStyle = color; ctx.textAlign = align; ctx.fillText(str, x, y);
}
function richText(str, x, y, size, weight, base, accent, maxW, align = "center") {
  const parts = str.split(/<|>/);
  let s = size, widths, total;
  do { ctx.font = KR(weight, s); widths = parts.map((p) => ctx.measureText(p).width); total = widths.reduce((q, v) => q + v, 0); s -= 2; } while (total > maxW && s > 20);
  let cx = align === "center" ? x - total / 2 : x; ctx.textAlign = "left";
  parts.forEach((p, i) => { ctx.fillStyle = i % 2 ? accent : base; ctx.fillText(p, cx, y); cx += widths[i]; });
}
function pill(text, x, y, bg, fg, size = 26, align = "center") {
  ctx.font = KR(800, size); const w = ctx.measureText(text).width + size * 1.4, h = size * 1.9;
  const x0 = align === "center" ? x - w / 2 : align === "right" ? x - w : x;
  ctx.fillStyle = bg; rr(x0, y - h / 2, w, h, h / 2); ctx.fill();
  ctx.fillStyle = fg; ctx.textAlign = "center"; ctx.fillText(text, x0 + w / 2, y + size * 0.36);
}
function lockIcon(x, y, s, color) {
  ctx.save(); ctx.strokeStyle = color; ctx.fillStyle = color; ctx.lineWidth = s * 0.16;
  ctx.beginPath(); ctx.arc(x, y - s * 0.12, s * 0.28, Math.PI, 0); ctx.lineTo(x + s * 0.28, y + s * 0.05); ctx.moveTo(x - s * 0.28, y + s * 0.05); ctx.lineTo(x - s * 0.28, y - s * 0.12); ctx.stroke();
  rr(x - s * 0.42, y, s * 0.84, s * 0.6, s * 0.1); ctx.fill(); ctx.restore();
}

// ---------------- 레이아웃 ----------------
const CROP = { sx: 0, sy: 0, sw: 1160, sh: 1360 };        // frames-src는 이미 얼굴~목으로 잘라 2배 확대됨
const L9 = {
  img: { x: 40, y: 470, w: 1000, h: 1172 },
  inset: { x: 690, y: 1240, w: 330, h: 387 },
  popup: { x: 690, y: 495, s: 1.15 },
  cap: { x: W / 2, y1: 268, y2: 360, y3: 428, maxW: 1000, align: "center", s1: 62, s2: 82, s3: 32 },
  disc: { x: W / 2, y: 1745 }
};
const L16 = {
  img: { x: 70, y: 40, w: 853, h: 1000 },
  inset: { x: 1000, y: 360, w: 400, h: 469 },
  popup: { x: 1450, y: 360, s: 1.35 },
  cap: { x: 1000, y1: 150, y2: 236, y3: 296, maxW: 860, align: "left", s1: 54, s2: 72, s3: 28 },
  disc: { x: 1000, y: 1040 }
};
const LY = WIDE ? L16 : L9;

// ---------------- 이미지 ----------------
const IMG = {};
const NAMES = ["orig", "gray", "sha-1", "sha-2", "sha-3", "sha-4", "sha-5"];
function load(n) { return new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = () => rej(new Error("frames-src/" + n + ".png 없음 — python lab.py 먼저 실행")); i.src = "frames-src/" + n + ".png"; IMG[n] = i; }); }

// 붓질처럼 대각선으로 쓸고 지나가는 전환(부드러운 경계)
const off = document.createElement("canvas"), ox = off.getContext("2d");
function drawWipe(a, b, k, r) {
  ctx.drawImage(IMG[a], CROP.sx, CROP.sy, CROP.sw, CROP.sh, r.x, r.y, r.w, r.h);
  if (k <= 0 || !b) return;
  if (k >= 1) { ctx.drawImage(IMG[b], CROP.sx, CROP.sy, CROP.sw, CROP.sh, r.x, r.y, r.w, r.h); return; }
  off.width = Math.ceil(r.w); off.height = Math.ceil(r.h);
  ox.globalCompositeOperation = "source-over"; ox.clearRect(0, 0, off.width, off.height);
  ox.drawImage(IMG[b], CROP.sx, CROP.sy, CROP.sw, CROP.sh, 0, 0, r.w, r.h);
  // (0,0)→(w,h) 방향 그라디언트. 앞부분(p)까지는 새 그림, p~p+soft는 부드러운 붓 경계
  const soft = 0.22, p = k * (1 + soft) - soft;
  const gx = ox.createLinearGradient(0, 0, r.w, r.h);
  gx.addColorStop(0, "rgba(0,0,0,1)");
  if (p > 0) gx.addColorStop(clamp(p), "rgba(0,0,0,1)");
  gx.addColorStop(clamp(p + soft), "rgba(0,0,0,0)");
  gx.addColorStop(1, "rgba(0,0,0,0)");
  ox.globalCompositeOperation = "destination-in"; ox.fillStyle = gx; ox.fillRect(0, 0, off.width, off.height);
  ctx.drawImage(off, r.x, r.y);
}

// ---------------- 펜으로 칠하기 ----------------
// 원본 800px 좌표 → 화면 좌표 (frames-src는 (x-150)*2, (y-40)*2 로 잘라 확대됨)
const toScr = (pt, r) => ({ x: r.x + (pt[0] - 150) * 2 * r.w / CROP.sw, y: r.y + (pt[1] - 40) * 2 * r.h / CROP.sh });
function pathLen(pts) { let L = 0; for (let i = 1; i < pts.length; i++) L += Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]); return L; }
function pointAt(pts, k) {
  let want = pathLen(pts) * clamp(k);
  for (let i = 1; i < pts.length; i++) {
    const d = Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]);
    if (want <= d) { const q = d ? want / d : 0; return [lerp(pts[i - 1][0], pts[i][0], q), lerp(pts[i - 1][1], pts[i][1], q)]; }
    want -= d;
  }
  return pts[pts.length - 1];
}
// a 위에 b를 "펜이 지나간 자리"만큼 드러냄. fill(0~1)은 붓이 덜 지나간 곳까지 마무리
const mk = document.createElement("canvas"), mx = mk.getContext("2d");
function drawStroke(a, b, pts, brush, k, fill, r) {
  ctx.drawImage(IMG[a], CROP.sx, CROP.sy, CROP.sw, CROP.sh, r.x, r.y, r.w, r.h);
  if (k > 0) {
    const sc = 2 * r.w / CROP.sw;
    mk.width = off.width = Math.ceil(r.w); mk.height = off.height = Math.ceil(r.h);
    mx.clearRect(0, 0, mk.width, mk.height);
    mx.filter = `blur(${Math.round(brush * sc * 0.18)}px)`;
    mx.strokeStyle = "#000"; mx.lineWidth = brush * sc; mx.lineCap = "round"; mx.lineJoin = "round";
    mx.beginPath();
    const end = pointAt(pts, k), total = pathLen(pts) * clamp(k);
    let acc = 0;
    const P0 = toScr(pts[0], { x: 0, y: 0, w: r.w, h: r.h }); mx.moveTo(P0.x, P0.y);
    for (let i = 1; i < pts.length; i++) {
      const d = Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]);
      const q = acc + d <= total ? pts[i] : end;
      const Q = toScr(q, { x: 0, y: 0, w: r.w, h: r.h }); mx.lineTo(Q.x, Q.y);
      acc += d; if (acc >= total) break;
    }
    mx.stroke(); mx.filter = "none";
    ox.globalCompositeOperation = "source-over"; ox.clearRect(0, 0, off.width, off.height);
    ox.drawImage(IMG[b], CROP.sx, CROP.sy, CROP.sw, CROP.sh, 0, 0, r.w, r.h);
    ox.globalCompositeOperation = "destination-in"; ox.drawImage(mk, 0, 0);
    ctx.drawImage(off, r.x, r.y);
  }
  if (fill > 0) { ctx.save(); ctx.globalAlpha = fill; ctx.drawImage(IMG[b], CROP.sx, CROP.sy, CROP.sw, CROP.sh, r.x, r.y, r.w, r.h); ctx.restore(); }
}
function drawPen(x, y, alpha = 1, press = 0) {
  if (alpha <= 0) return;
  const s = WIDE ? 0.85 : 1;
  ctx.save(); ctx.globalAlpha = alpha; ctx.translate(x, y); ctx.scale(s, s); ctx.rotate(0.55);
  ctx.shadowColor = "rgba(0,0,0,0.45)"; ctx.shadowBlur = 18; ctx.shadowOffsetX = 10; ctx.shadowOffsetY = 12;
  ctx.fillStyle = "#2a2730"; rr(-13, -320, 26, 288, 13); ctx.fill();
  ctx.shadowColor = "transparent";
  ctx.fillStyle = "#4a4552"; rr(-13, -160, 26, 38, 5); ctx.fill();
  ctx.fillStyle = "#3a3640"; rr(-13, -320, 26, 40, [13, 13, 4, 4]); ctx.fill();
  ctx.fillStyle = "#d8d1c6"; ctx.beginPath(); ctx.moveTo(-11, -34); ctx.lineTo(0, 0); ctx.lineTo(11, -34); ctx.closePath(); ctx.fill();
  ctx.restore();
  if (press > 0) { ctx.save(); ctx.globalAlpha = alpha * press * 0.6; ctx.strokeStyle = GOLD; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(x, y, 12 + 16 * press, 0, 7); ctx.stroke(); ctx.restore(); }
}
// 펜 위치: 획마다 팝업 ↔ 얼굴 왕복
function penAt(t) {
  const r = LY.img;
  if (t < STROKES[0].t0 || t > END_PAINT + 0.25 || !POPUP_CURSOR) return null;
  const i = strokeAt(t), S = STROKES[i], c = POPUP_CURSOR;
  const st = toScr(S.path[0], r);
  if (t < S.t0 + PH.go0) {                                   // 팝업으로 와서 색 찍기
    if (i === 0) return { x: c.x, y: c.y, a: prog(t, S.t0, S.t0 + 0.15), press: t > S.t0 + 0.2 ? 1 : 0 };
    const pe = toScr(STROKES[i - 1].path[STROKES[i - 1].path.length - 1], r), k = eio(prog(t, S.t0 - 0.1, S.t0 + 0.2));
    return { x: lerp(pe.x, c.x, k), y: lerp(pe.y, c.y, k), a: 1, press: t > S.t0 + 0.2 ? 1 : 0 };
  }
  if (t < S.t0 + PH.go1) { const k = eio(prog(t, S.t0 + PH.go0, S.t0 + PH.go1)); return { x: lerp(c.x, st.x, k), y: lerp(c.y, st.y, k), a: 1, press: 0 }; }
  const q = toScr(pointAt(S.path, prog(t, S.t0 + PH.go1, S.t0 + PH.p1)), r);
  return { x: q.x, y: q.y, a: S === LAST ? 1 - prog(t, END_PAINT, END_PAINT + 0.25) : 1, press: t < S.t0 + PH.p1 ? 1 : 0 };
}

// ---------------- 팝업(SHA Paint 필드) ----------------
const POP_W = 300, POP_H = 270;
let POPUP_CURSOR = null;
const FIELDS = {};
function makeField(L, w, h) {
  let range = 0; for (let hh = 0; hh < 360; hh += 10) range += CM.findMaxChromaForHue(L, hh) / 36;
  range *= 1.2;
  const oc = document.createElement("canvas"); oc.width = w; oc.height = h;
  const o = oc.getContext("2d"), img = o.createImageData(w, h), sc = range / Math.min(w / 2, h / 2);
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    const c = CM.labFieldPixel(L, (x - w / 2) * sc, (y - h / 2) * sc, false), i = (y * w + x) * 4;
    if (c) { img.data[i] = c.r; img.data[i + 1] = c.g; img.data[i + 2] = c.b; img.data[i + 3] = 255; }
  }
  o.putImageData(img, 0, 0);
  return { cv: oc, w, h, sc };
}
// SHA Paint 획: 그 자리 명도(L)의 필드에서 목표 색조(h)를 고름 (lab.py ACCENTS와 같은 색조)
// 획마다(t0 기준): 팝업에서 색 고르기(0~0.3) → 얼굴로 이동(0.33~0.48) → 펜이 지나간 자리만 칠해짐(0.48~1.1) → 마무리(1.05~1.15)
// path: 원본 800px 그림 좌표, brush: 붓 두께(같은 좌표계). h/L: 팝업에서 고르는 색조/그 자리 명도 (lab.py ACCENTS와 같은 색조)
const PH = { go0: 0.33, go1: 0.48, p1: 1.1, f0: 1.05, f1: 1.15 };
const STROKES = [
  { t0: 2.1, img: "sha-1", h: 286, L: 16, brush: 120, path: [[275, 95], [420, 90], [285, 250], [255, 420], [330, 485], [450, 500], [430, 600], [470, 650]] },
  { t0: 3.35, img: "sha-2", h: 0, L: 28, brush: 115, path: [[265, 215], [300, 330], [335, 395], [440, 320], [470, 340], [560, 300]] },
  { t0: 4.6, img: "sha-3", h: 68, L: 42, brush: 125, path: [[300, 140], [450, 180], [300, 300], [460, 300], [340, 445], [560, 560], [610, 610]] },
  { t0: 5.85, img: "sha-4", h: 228, L: 22, brush: 115, path: [[250, 330], [370, 500], [470, 505], [400, 590], [615, 575]] },
  { t0: 7.1, img: "sha-5", h: 325, L: 20, brush: 95, path: [[275, 90], [430, 85], [575, 250], [560, 330]] }
];
const LAST = STROKES[STROKES.length - 1], END_PAINT = LAST.t0 + PH.f1;
function strokeAt(t) { let i = 0; STROKES.forEach((s, k) => { if (t >= s.t0) i = k; }); return i; }
function drawPopup(alpha, scale, t, lockA) {
  if (alpha <= 0) return;
  const p = LY.popup, w = POP_W, h = POP_H;
  const i = strokeAt(t), S = STROKES[i], F = FIELDS[S.L], prev = STROKES[Math.max(0, i - 1)];
  const mv = i === 0 ? 1 : eio(prog(t, S.t0 + 0.05, S.t0 + 0.28));      // 다음 획으로 커서 이동
  const hue = prev.h + ((((S.h - prev.h) + 540) % 360) - 180) * mv;
  const c = Math.min(CM.findMaxChromaForHue(S.L, hue) * 0.6, 34);
  const ab = CM.polarToAB(c, hue), cur = CM.labToRgb(S.L, ab.a, ab.b, true);
  ctx.save(); ctx.globalAlpha = alpha; ctx.translate(p.x, p.y); ctx.scale(p.s * scale, p.s * scale);
  ctx.shadowColor = "rgba(0,0,0,0.5)"; ctx.shadowBlur = 30; ctx.shadowOffsetY = 12;
  ctx.fillStyle = "#2b2b2f"; rr(0, 0, w, h, 16); ctx.fill(); ctx.shadowColor = "transparent";
  ctx.strokeStyle = "rgba(232,163,61,0.45)"; ctx.lineWidth = 1.5; rr(0, 0, w, h, 16); ctx.stroke();
  ctx.save(); rr(12, 12, w - 24, 172, 8); ctx.clip(); ctx.fillStyle = "#3a3a3f"; ctx.fillRect(12, 12, w - 24, 172); ctx.drawImage(F.cv, 12, 12); ctx.restore();
  const fx = 12 + F.w / 2 + ab.a / F.sc, fy = 12 + F.h / 2 + ab.b / F.sc;
  POPUP_CURSOR = { x: p.x + fx * p.s * scale, y: p.y + fy * p.s * scale };
  ctx.strokeStyle = "#fff"; ctx.lineWidth = 2.5; ctx.beginPath(); ctx.arc(fx, fy, 8, 0, 7); ctx.stroke();
  const g = ctx.createLinearGradient(12, 0, w - 12, 0); g.addColorStop(0, "#1b1b1f"); g.addColorStop(1, "#f2f2f2");
  ctx.fillStyle = g; rr(12, 196, w - 24, 12, 6); ctx.fill();
  const hx = 12 + (w - 24) * S.L / 100;
  ctx.fillStyle = "#fff"; rr(hx - 4, 192, 8, 20, 3); ctx.fill();
  if (lockA > 0) { ctx.globalAlpha = alpha * lockA; ctx.fillStyle = GOLD; ctx.beginPath(); ctx.arc(hx, 172, 14, 0, 7); ctx.fill(); lockIcon(hx, 168, 17, "#fff"); ctx.globalAlpha = alpha; }
  ctx.fillStyle = css(cur); rr(14, 224, 30, 30, 6); ctx.fill();
  STROKES.forEach((s2, k) => { if (k > i) return; const q = CM.polarToAB(Math.min(CM.findMaxChromaForHue(s2.L, s2.h) * 0.6, 34), s2.h);
    ctx.fillStyle = css(CM.labToRgb(s2.L, q.a, q.b, true)); rr(58 + k * 28, 230, 20, 20, 5); ctx.fill(); });
  ctx.fillStyle = "#c9c9cf"; ctx.font = KR(800, 16); ctx.textAlign = "right"; ctx.fillText("L* " + S.L + " " + (LANG === "ko" ? "고정" : "locked"), w - 14, 248);
  ctx.restore();
  // 지금 칠하는 곳
  ctx.save(); ctx.globalAlpha = alpha * clamp(prog(t, 2.2, 2.4));
  pill(T.strokes[i], p.x + w * p.s / 2, p.y + h * p.s + 34, "rgba(20,19,23,0.88)", INK, WIDE ? 26 : 26);
  ctx.restore();
}

// ---------------- 장면 ----------------
function mainImage(t) {
  const r = LY.img;
  if (t < STROKES[0].t0) return drawWipe("orig", null, 0, r);
  if (t < 8.5) {
    const i = strokeAt(t), S = STROKES[i];
    return drawStroke(i ? STROKES[i - 1].img : "orig", S.img, S.path, S.brush, prog(t, S.t0 + PH.go1, S.t0 + PH.p1), prog(t, S.t0 + PH.f0, S.t0 + PH.f1), r);
  }
  if (t < 10.1) return compare(t, r);
  return drawWipe("sha-5", "gray", eio(prog(t, 10.1, 10.65)), r);
}
// 원본(왼쪽) ↔ 완성(오른쪽) 슬라이드 비교
function compare(t, r) {
  const k = t < 9.1 ? lerp(0.5, 0.12, eio(prog(t, 8.5, 9.1))) : lerp(0.12, 0.88, eio(prog(t, 9.1, 9.75)));
  const sx = r.x + r.w * k;
  drawWipe("sha-5", null, 0, r);
  ctx.save(); ctx.beginPath(); ctx.rect(r.x, r.y, sx - r.x, r.h); ctx.clip(); drawWipe("orig", null, 0, r); ctx.restore();
  ctx.fillStyle = "#fff"; ctx.fillRect(sx - 2, r.y, 4, r.h);
  ctx.beginPath(); ctx.arc(sx, r.y + r.h / 2, 22, 0, 7); ctx.fill();
  ctx.fillStyle = BG; ctx.font = KR(900, 22); ctx.textAlign = "center"; ctx.fillText("‹ ›", sx, r.y + r.h / 2 + 8);
  pill(T.before, r.x + 18, r.y + 40, "rgba(20,19,23,0.85)", INK, 24, "left");
  pill(T.after, r.x + r.w - 18, r.y + 40, GOLD, "#241a08", 24, "right");
}
function inset(t) {
  const r = LY.inset;
  const a = eout(prog(t, 0.9, 1.3));
  if (a <= 0) return;
  ctx.save(); ctx.globalAlpha = a;
  ctx.shadowColor = "rgba(0,0,0,0.55)"; ctx.shadowBlur = 24; ctx.shadowOffsetY = 8;
  ctx.fillStyle = "#000"; rr(r.x, r.y, r.w, r.h, 14); ctx.fill(); ctx.shadowColor = "transparent";
  ctx.save(); rr(r.x, r.y, r.w, r.h, 14); ctx.clip();
  drawWipe("gray", null, 0, r);
  ctx.restore();
  pill(T.gray, r.x + 14, r.y + 32, "rgba(20,19,23,0.85)", INK, 22, "left");
  // 상태 테두리 + 배지
  let st = null;
  if (t >= 2.7 && t < 12.2) st = { ok: true, a: prog(t, 2.7, 3.0) };
  if (st) {
    ctx.globalAlpha = a * st.a;
    ctx.strokeStyle = st.ok ? GOOD : BAD; ctx.lineWidth = 6; rr(r.x - 3, r.y - 3, r.w + 6, r.h + 6, 16); ctx.stroke();
    pill((st.ok ? "✓ " : "! ") + (st.ok ? T.kept : T.broken), r.x + r.w / 2, r.y + r.h + 40, st.ok ? GOOD : BAD, "#fff", WIDE ? 26 : 26);
  }
  ctx.restore();
}
function caption(t) {
  let cap = null;
  for (const c of T.caps) if (t >= c.t0 && t <= c.t1) cap = c;
  if (!cap) return;
  const c = LY.cap;
  const a = Math.min(eout(prog(t, cap.t0, cap.t0 + 0.25)), 1 - prog(t, cap.t1 - 0.15, cap.t1));
  ctx.save(); ctx.globalAlpha = a; ctx.translate(0, (1 - a) * 14);
  fitText(cap.l1, c.x, c.y1, c.maxW, c.s1, 800, INK, c.align);
  fitText(cap.l2, c.x, c.y2, c.maxW, c.s2, 900, GOLD, c.align);
  fitText(cap.sub, c.x, c.y3, c.maxW, c.s3, 500, DIM, c.align);
  ctx.restore();
}
function endCard(t) {
  const a = eout(prog(t, 12.2, 12.6));
  ctx.save(); ctx.globalAlpha = a;
  ctx.fillStyle = BG; ctx.fillRect(0, 0, W, H);
  const tw = WIDE ? 400 : 450, th = tw * CROP.sh / CROP.sw;
  const pair = WIDE ? { x: 110, y: (H - th) / 2 } : { x: (W - tw * 2 - 30) / 2, y: 300 };
  [["orig", T.before], ["sha-5", T.after]].forEach(([n, lab], i) => {
    const r = { x: pair.x + i * (tw + 30), y: pair.y, w: tw, h: th };
    ctx.save(); rr(r.x, r.y, r.w, r.h, 16); ctx.clip(); drawWipe(n, null, 0, r); ctx.restore();
    pill(lab, r.x + 16, r.y + 34, i ? GOLD : "rgba(20,19,23,0.85)", i ? "#241a08" : INK, 24, "left");
  });
  const cx = WIDE ? 1400 : W / 2, base = WIDE ? 500 : 1060;
  ctx.fillStyle = INK; ctx.font = `700 ${WIDE ? 110 : 116}px Serif, serif`; ctx.textAlign = "center"; ctx.fillText("SHA Paint", cx, base);
  richText(T.tag, cx, base + 92, WIDE ? 50 : 56, 900, INK, GOLD, WIDE ? 760 : 980);
  fitText(T.meta, cx, base + 158, WIDE ? 760 : 980, 32, 500, DIM);
  if (WIDE) { ctx.restore(); return; }   // 가로판은 사이트용: 구매 버튼은 페이지에 있으니 생략
  const ba = eout(prog(t, 12.8, 13.2));
  ctx.globalAlpha = a * ba;
  ctx.font = KR(800, 42); const bw = ctx.measureText(T.cta).width + 110;
  ctx.fillStyle = GOLD; rr(cx - bw / 2, base + 210, bw, 100, 50); ctx.fill();
  ctx.fillStyle = "#241a08"; ctx.textAlign = "center"; ctx.fillText(T.cta, cx, base + 275);
  ctx.restore();
}
function hueStrip(y) {
  const g = ctx.createLinearGradient(0, 0, W, 0);
  ["#f34b8e", "#f45351", "#d4711e", "#a58920", "#709821", "#2d9f59", "#2d9b8a", "#3099a4", "#3890dd", "#887cf1", "#ec36e1", "#f34b8e"].forEach((c, i, arr) => g.addColorStop(i / (arr.length - 1), c));
  ctx.fillStyle = g; ctx.fillRect(0, y, W, 8);
}

function renderAt(t) {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = BG; ctx.fillRect(0, 0, W, H);
  hueStrip(0);
  if (!WIDE) { ctx.fillStyle = DIM; ctx.font = "700 32px Serif, serif"; ctx.textAlign = "center"; ctx.fillText("SHA Paint", W / 2, 140); }
  else { ctx.fillStyle = DIM; ctx.font = "700 30px Serif, serif"; ctx.textAlign = "left"; ctx.fillText("SHA Paint", 1000, 76); }
  if (t < 12.6) {
    const r = LY.img;
    ctx.save(); rr(r.x, r.y, r.w, r.h, 18); ctx.clip(); mainImage(t); ctx.restore();
    inset(t);
    const pa = clamp(prog(t, 1.9, 2.1)) * (1 - prog(t, END_PAINT, END_PAINT + 0.2));
    drawPopup(pa, back(prog(t, 1.9, 2.25)), t, prog(t, 2.2, 2.5));
    const pen = penAt(t);
    if (pen) drawPen(pen.x, pen.y, pen.a, pen.press);
    caption(t);
    ctx.fillStyle = FAINT; ctx.font = KR(500, WIDE ? 20 : 22); ctx.textAlign = WIDE ? "left" : "center";
    ctx.fillText(T.disc, LY.disc.x, LY.disc.y);
  }
  if (t >= 12.2) endCard(t);
  hueStrip(H - 8);
}

window.SFX_CUES = [
  { t: 0.2, type: "swell", vol: 0.5 }, { t: 1.0, type: "tick", vol: 0.6 }, { t: 1.9, type: "pop" },
  ...STROKES.flatMap((s) => [{ t: s.t0 + 0.22, type: "click", vol: 0.8 }, { t: s.t0 + 0.48, type: "scribble", dur: 0.62 }]),
  { t: 3.0, type: "chime", vol: 0.3 }, { t: 8.5, type: "whoosh", vol: 0.5 }, { t: 9.1, type: "whoosh", vol: 0.4 },
  { t: 10.1, type: "whoosh", vol: 0.5 }, { t: 10.7, type: "chime", vol: 0.45 },
  { t: 12.25, type: "swell" }, { t: 12.85, type: "chime" }
];
window.AD_INFO = { DURATION, W, H, LANG, WIDE };
window.renderAt = renderAt;
function start() {
  return Promise.all([document.fonts.load(KR(900, 40)), document.fonts.load(KR(800, 40)), document.fonts.load(KR(500, 20)), document.fonts.load("700 40px Serif")].map((p) => p.catch(() => null)))
    .then(() => Promise.all(NAMES.map(load)))
    .then(() => { STROKES.forEach((s) => { if (!FIELDS[s.L]) FIELDS[s.L] = makeField(s.L, 276, 172); }); renderAt(0); window.__adReady = true; });
}
window.__start = start;
if (!RENDER) start().then(() => {
  const t0 = performance.now();
  const loop = () => { renderAt(((performance.now() - t0) / 1000) % DURATION); requestAnimationFrame(loop); };
  loop();
});
})();
</script>
