<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<title>SHA Paint Store Images</title>
<!--
  Gumroad 표지(1280x720) / 썸네일(600x600) 원본.
  ?mode=cover | ?mode=thumb  — render-store-images.js가 각각 캡처한다.
  팔레트 필드는 앱의 실제 색 계산(../../app/colorMath.js)으로 그린다
  (앱의 "전체 색역 보기" 모드와 같은 범위 계산).
-->
<style>
  @font-face { font-family: "KR"; src: local("Noto Sans KR"), local("NotoSansKR"), url("file:///C:/Windows/Fonts/NotoSansKR-VF.ttf"); font-weight: 100 900; }
  @font-face { font-family: "KRFallback"; src: local("Malgun Gothic"), local("맑은 고딕"); }
  @font-face { font-family: "Serif"; src: local("Noto Serif Bold"), local("NotoSerif-Bold"), url("file:///C:/Windows/Fonts/NotoSerif-Bold.ttf"); font-weight: 700; }

  :root {
    --bg: #1c1a1f;
    --bg-raised: #242128;
    --panel: #2b2b2f;
    --field-bg: #3a3a3f;
    --ink: #f2ede4;
    --ink-dim: #a79f97;
    --ink-faint: #75706b;
    --gold: #e8a33d;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: var(--bg); }
  body { font-family: "KR", "KRFallback", sans-serif; color: var(--ink); overflow: hidden; }

  .stage { position: relative; overflow: hidden; background:
      radial-gradient(520px 420px at 72% 52%, rgba(232,163,61,0.13), transparent 70%),
      radial-gradient(460px 380px at 88% 30%, rgba(136,124,241,0.12), transparent 70%),
      var(--bg); }
  .hue-strip { position: absolute; left: 0; right: 0; bottom: 0; height: 6px;
    background: linear-gradient(90deg, #f45351, #e8a33d, #d9d24a, #2d9f59, #3099a4, #3890dd, #887cf1, #ec36e1, #f45351); }

  /* ---- 팝업 (app/overlay.css를 축소 재현) ---- */
  .popup { position: absolute; background: var(--panel); border: 1px solid #1c1c1f; border-radius: 16px;
    box-shadow: 0 18px 48px rgba(0,0,0,0.6); padding: 12px; display: flex; flex-direction: column; gap: 10px; }
  .popup .top { display: flex; justify-content: flex-end; gap: 6px; height: 22px; }
  .popup .icon { width: 22px; height: 22px; border-radius: 5px; background: #3d3d42; border: 1px solid #1c1c1f; }
  .popup .icon.on { background: #4a7cff; border-color: #2b5be0; }
  .field-wrap { position: relative; background: var(--field-bg); border-radius: 8px; overflow: hidden; }
  .field-wrap canvas { display: block; }
  .field-cursor { position: absolute; width: 16px; height: 16px; margin: -8px 0 0 -8px; border-radius: 50%;
    border: 2px solid #fff; box-shadow: 0 0 0 1px rgba(0,0,0,0.6); }
  .light-outer { position: relative; height: 12px; border-radius: 6px; background: #232327; }
  .light-track { position: absolute; top: 0; bottom: 0; border-radius: 6px; }
  .light-handle { position: absolute; top: -3px; width: 8px; height: 18px; margin-left: -4px; border-radius: 3px;
    background: #fff; box-shadow: 0 0 0 1px rgba(0,0,0,0.6); }
  .bottom { display: flex; align-items: center; gap: 12px; }
  .stack { position: relative; width: 40px; height: 34px; flex: none; }
  .stack div { position: absolute; width: 26px; height: 26px; border-radius: 6px; border: 1px solid rgba(255,255,255,0.18); }
  .stack .back { right: 0; bottom: 0; }
  .stack .front { left: 0; top: 0; box-shadow: 0 2px 6px rgba(0,0,0,0.5); }
  .history { display: flex; gap: 6px; }
  .history div { width: 20px; height: 20px; border-radius: 5px; border: 1px solid rgba(255,255,255,0.15); }

  /* ---- 표지 ---- */
  #cover { width: 1280px; height: 720px; display: none; }
  #cover .copy { position: absolute; left: 96px; top: 0; bottom: 0; width: 600px; display: flex; flex-direction: column; justify-content: center; gap: 22px; }
  .eyebrow { font-size: 20px; font-weight: 500; letter-spacing: 3px; color: var(--ink-dim); }
  .wordmark { font-family: "Serif", serif; font-weight: 700; font-size: 108px; line-height: 1; letter-spacing: -1px; }
  .tagline { font-size: 42px; font-weight: 800; line-height: 1.25; letter-spacing: -0.5px; }
  .tagline b { color: var(--gold); font-weight: 800; }
  .chips { display: flex; gap: 10px; margin-top: 6px; }
  .chip { font-size: 20px; font-weight: 600; color: var(--ink); background: var(--bg-raised); border: 1px solid #3a363f;
    border-radius: 999px; padding: 8px 18px; }
  #cover .popup { left: 792px; top: 196px; width: 380px; }
  #cover .pen { position: absolute; left: 744px; top: 40px; }

  /* ---- 썸네일 ---- */
  #thumb { width: 600px; height: 600px; display: none; }
  #thumb .popup { left: 110px; top: 40px; width: 380px; transform: scale(0.86); transform-origin: 50% 0; }
  #thumb .name { position: absolute; left: 0; right: 0; top: 404px; text-align: center; }
  #thumb .wordmark { font-size: 76px; }
  #thumb .sub { margin-top: 12px; font-size: 28px; font-weight: 800; color: var(--ink-dim); }
  #thumb .sub b { color: var(--gold); }
</style>
<script src="../../app/colorMath.js"></script>
</head>
<body>

<div id="cover" class="stage">
  <div class="copy">
    <div class="eyebrow">PHOTOSHOP 플러그인 · WINDOWS</div>
    <div class="wordmark">SHA Paint</div>
    <div class="tagline">펜 옆에 뜨는<br><b>동명도</b> 팔레트</div>
    <div class="chips">
      <span class="chip">같은 밝기</span>
      <span class="chip">어울리는 색만</span>
      <span class="chip">고른 색은 모아두기</span>
    </div>
  </div>
  <svg class="pen" width="150" height="190" viewBox="0 0 150 190" aria-hidden="true">
    <!-- 펜촉(왼쪽 아래 끝)이 팝업 좌상단 -16px 지점(=커서 위치)에 오도록 배치 -->
    <g transform="translate(32 140) rotate(-52)">
      <rect x="18" y="-11" width="150" height="22" rx="11" fill="#2a2730" stroke="#4a4552" stroke-width="2"/>
      <rect x="44" y="-11" width="30" height="22" fill="#38343f"/>
      <path d="M18 -9 L0 0 L18 9 Z" fill="#cfc8bd"/>
      <circle cx="0" cy="0" r="2.5" fill="#f2ede4"/>
    </g>
  </svg>
  <div class="popup" data-w="356" data-h="270"></div>
  <div class="hue-strip"></div>
</div>

<div id="thumb" class="stage">
  <div class="popup" data-w="356" data-h="270"></div>
  <div class="name">
    <div class="wordmark">SHA Paint</div>
    <div class="sub">펜 옆의 <b>동명도</b> 팔레트</div>
  </div>
  <div class="hue-strip"></div>
</div>

<script>
  const CM = window.ColorMath;
  const L = 66;            // 표지 팔레트의 고정 명도
  const CUR_HUE = 18;      // 현재 색(따뜻한 코랄)

  function rgbCss(c) { return `rgb(${c.r},${c.g},${c.b})`; }

  // 앱 overlay.js의 computeFullGamutRange와 같은 방식
  function fullRange(Lv) {
    let maxC = 0;
    for (let h = 0; h < 360; h += 15) maxC = Math.max(maxC, CM.findMaxChromaForHue(Lv, h));
    return Math.max(10, maxC * 1.05);
  }

  function colorAt(hue, ratio) {
    const c = CM.findMaxChromaForHue(L, hue) * ratio;
    const { a, b } = CM.polarToAB(c, hue);
    return CM.labFieldPixel(L, a, b, true);
  }

  function buildPopup(el) {
    const w = +el.dataset.w, h = +el.dataset.h;
    el.innerHTML = `
      <div class="top"><div class="icon on"></div><div class="icon"></div></div>
      <div class="field-wrap" style="width:${w}px;height:${h}px"><canvas width="${w * 2}" height="${h * 2}" style="width:${w}px;height:${h}px"></canvas><div class="field-cursor"></div></div>
      <div class="light-outer"><div class="light-track"><div class="light-handle"></div></div></div>
      <div class="bottom"><div class="stack"><div class="back"></div><div class="front"></div></div><div class="history"></div></div>`;

    // 필드: 고정 L*에서 실제로 존재하는 색만 칠한다 (색역 밖은 투명 -> 비정형 경계)
    const cv = el.querySelector("canvas");
    const ctx = cv.getContext("2d");
    const W = cv.width, H = cv.height, cx = W / 2, cy = H / 2;
    const range = fullRange(L);
    const scale = range / Math.min(cx, cy);
    const img = ctx.createImageData(W, H);
    for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
      const rgb = CM.labFieldPixel(L, (x - cx) * scale, (y - cy) * scale, false);
      const i = (y * W + x) * 4;
      if (rgb) { img.data[i] = rgb.r; img.data[i + 1] = rgb.g; img.data[i + 2] = rgb.b; img.data[i + 3] = 255; }
    }
    ctx.putImageData(img, 0, 0);

    // 커서: 현재 색 위치
    const curC = CM.findMaxChromaForHue(L, CUR_HUE) * 0.72;
    const p = CM.polarToAB(curC, CUR_HUE);
    const cur = el.querySelector(".field-cursor");
    cur.style.left = (w / 2 + p.a / (scale * 2) * 1) + "px";
    cur.style.left = (w / 2 + (p.a / scale) / 2) + "px";
    cur.style.top = (h / 2 + (p.b / scale) / 2) + "px";

    // 명도 트랙: 이 색상/채도를 유지한 채 가능한 L* 구간의 그라데이션
    const lr = CM.findLightnessRangeForChroma(CUR_HUE, curC);
    const track = el.querySelector(".light-track");
    track.style.left = lr.Lmin + "%";
    track.style.width = Math.max(0, lr.Lmax - lr.Lmin) + "%";
    const stops = [];
    for (let i = 0; i <= 12; i++) {
      const Lv = lr.Lmin + (lr.Lmax - lr.Lmin) * i / 12;
      stops.push(`${rgbCss(CM.labFieldPixel(Lv, p.a, p.b, true) || { r: 128, g: 128, b: 128 })} ${(i / 12 * 100).toFixed(1)}%`);
    }
    track.style.background = `linear-gradient(90deg, ${stops.join(",")})`;
    el.querySelector(".light-handle").style.left = ((L - lr.Lmin) / (lr.Lmax - lr.Lmin) * 100) + "%";

    // 스와치: 현재/이전, 히스토리 = 모두 같은 L*의 여러 색
    el.querySelector(".front").style.background = rgbCss(colorAt(CUR_HUE, 0.72));
    el.querySelector(".back").style.background = rgbCss(colorAt(300, 0.6));
    const hist = el.querySelector(".history");
    [[18, .72], [55, .7], [300, .6], [95, .55], [200, .65], [340, .7], [250, .6], [140, .5]].forEach(([hh, rr]) => {
      const d = document.createElement("div");
      d.style.background = rgbCss(colorAt(hh, rr));
      hist.appendChild(d);
    });
  }

  const mode = new URLSearchParams(location.search).get("mode") || "cover";
  // ?lang=en → 영문 표지/썸네일
  if (new URLSearchParams(location.search).get("lang") === "en") {
    document.documentElement.lang = "en";
    document.querySelector("#cover .eyebrow").textContent = "PHOTOSHOP PLUGIN · WINDOWS";
    document.querySelector("#cover .tagline").innerHTML = "The <b>same-value</b> palette,<br>right by your pen";
    document.querySelector("#cover .chips").innerHTML = '<span class="chip">Same value</span><span class="chip">Only colors that fit</span><span class="chip">Saved picks</span>';
    document.querySelector("#thumb .sub").innerHTML = "The <b>same-value</b> palette";
  }
  const root = document.getElementById(mode === "thumb" ? "thumb" : "cover");
  root.style.display = "block";
  root.querySelectorAll(".popup").forEach(buildPopup);
  document.fonts.ready.then(() => { window.__ready = true; });
</script>
</body>
</html>
